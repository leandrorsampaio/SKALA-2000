:"Dosis", "Arial Narrow", sans-serif;--font-nixie:"Nixie One", Georgia, serif;--font-marker:"Permanent Marker", cursive;--font-pencil:"Caveat", cursive;}

:root[data-theme="dark"]{--enamel:#59615a;--enamel-panel:#667067;--enamel-edge:#2f3631;--enamel-recess:#525b53;--finish-ivory:#8a8572;--finish-ivory-edge:#55513f;--ink-on-ivory:#f1efe6;--finish-graphite:#232628;--finish-graphite-edge:#0c0e0f;--ink-on-graphite:#e9e6da;--ink:#f1efe6;--bakelite:#111110;--engraving:#e6e3d6;--bezel:#151513;--aluminium:#8d9088;--tag:#9a9d95;--tag-ink:#111110;--paper:#cfcab8;--instruction:#c9b96f;--meter-face:#d9cd9f;--lamp-red-on:#c8321f;--lamp-red-hot:#e8664f;--lamp-red-off:#5f3a33;--lamp-green-on:#25783e;--lamp-green-off:#34473a;--lamp-amber-on:#f0b323;--lamp-amber-off:#9a8546;--lamp-white-on:#ffe9a8;--lamp-white-off:#a39a78;--lamp-green-hot:#3f9a5a;--lamp-amber-hot:#ffd36b;--lamp-white-hot:#fff8dc;--ink-red-off:#f6e8e4;--ink-red-on:#fff3ec;--ink-green-off:#e6f0e7;--ink-green-on:#f2fff4;--ink-amber-off:#1b1b19;--ink-amber-on:#4a2f00;--ink-white-off:#1b1b19;--ink-white-on:#4a3a12;--ink-light-off:#f4efe6;--ink-light-on:#fffaf0;--ink-dark-off:#1b1b19;--ink-dark-on:#33240c;--nixie-glass:#2a0e04;--nixie-glow:#ffa64d;--nixie-halo:#ff6a00;--drum-wheel:#d8d5c8;--drum-ink:#111111;--brass:#8a7636;--stockroom-red:#d9523f;--glow-red:0 0 26px 7px rgba(200,50,31,0.42);--glow-green:0 0 26px 7px rgba(37,120,62,0.42);--glow-amber:0 0 26px 7px rgba(240,179,35,0.42);--glow-white:0 0 26px 7px rgba(255,233,168,0.42);--glow-nixie:0 0 9px #ff6a00;--glass-inset:inset 0 0 12px #000000;--cap-up:0 3px 4px rgba(0,0,0,0.65);--cap-down:inset 0 9px 8px -3px rgba(0,0,0,0.85);--plate-raise:0 2px 3px rgba(0,0,0,0.45);--recess:inset 0 3px 5px rgba(0,0,0,0.55);--panel-raise:0 2px 6px rgba(0,0,0,0.4);}

/* PK-4 Console: reference styles. Every colour, radius and size is a token from tokens.css. */
.pk-stage{margin:0;padding:24px;box-sizing:border-box;min-height:100%;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;color:var(--ink);font-family:var(--font-label);background-color:var(--enamel-panel);
 background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.16) 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.10) 0 2px,transparent 3px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.10) 0 1px,transparent 2px);background-size:13px 11px,17px 15px,9px 13px}
.pk-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.pk-row{display:flex;align-items:center;gap:10px}
.pk-hint{width:100%;font:600 13px/1.3 var(--font-engraved);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.pk-panel{box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-3);border:3px solid var(--enamel-edge);border-radius:var(--radius-panel);background-color:var(--enamel-panel);background-image:inherit;background-size:inherit}
.pk-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pk-screw{width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--enamel-edge);background:linear-gradient(var(--enamel-edge),var(--enamel-edge)) center/10px 2px no-repeat,var(--enamel-recess);flex:none}
.pk-blank{box-sizing:border-box;padding:6px;display:flex;align-items:center;justify-content:center;background:var(--enamel-recess);border:2px solid var(--enamel-edge);border-radius:var(--radius-window);font:600 13px/1.2 var(--font-engraved);letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.pk-plate{box-sizing:border-box;background:var(--bakelite);color:var(--engraving);font:600 13px/1.25 var(--font-engraved);letter-spacing:.09em;text-transform:uppercase;text-align:center;padding:4px 8px;border-radius:var(--radius-plate)}
.pk-plate.is-title{font-size:20px}
.pk-note{box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--instruction);border:2px solid var(--bezel);border-radius:var(--radius-plate);color:var(--tag-ink);font:600 13px/1.25 var(--font-engraved);letter-spacing:.09em;text-transform:uppercase;text-align:center}
.pk-note::before,.pk-note::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--aluminium);border:1px solid var(--bezel);flex:none}
.pk-tag{box-sizing:border-box;padding:0 4px;background:var(--tag);border:1px solid var(--enamel-edge);color:var(--tag-ink);font:600 11px/1.2 var(--font-engraved);letter-spacing:.04em}
.pk-pencil{box-sizing:border-box;width:92px;height:44px;padding:2px 4px;background:var(--paper);border:2px solid var(--bezel);border-radius:var(--radius-plate);font:400 22px/1 var(--font-pencil);color:#4a4a48;text-align:center}
.pk-pencil:focus-visible,.pk-btn:focus-visible,.pk-round:focus-visible,.pk-svgbtn:focus-visible,.pk-key:focus-visible,.pk-flap:focus-visible{outline:3px solid var(--lamp-amber-on);outline-offset:3px}

/* lamp window */
.pk-window{--on:var(--lamp-white-on);--off:var(--lamp-white-off);--hot:var(--lamp-white-hot);--fg-on:var(--ink-white-on);--fg-off:var(--ink-white-off);--glow:var(--glow-white);
 position:relative;box-sizing:border-box;width:var(--window-w);height:var(--window-h);display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;text-align:center;border:var(--bezel-w) solid var(--bezel);border-radius:var(--radius-window);background:var(--off);color:var(--fg-off);font:600 12px/1.05 var(--font-label);letter-spacing:.06em;text-transform:uppercase;transition:color .22s ease-out,text-shadow .22s ease-out}
.pk-window[data-color=red]{--on:var(--lamp-red-on);--off:var(--lamp-red-off);--hot:var(--lamp-red-hot);--fg-on:var(--ink-red-on);--fg-off:var(--ink-red-off);--glow:var(--glow-red)}
.pk-window[data-color=green]{--on:var(--lamp-green-on);--off:var(--lamp-green-off);--hot:var(--lamp-green-hot);--fg-on:var(--ink-green-on);--fg-off:var(--ink-green-off);--glow:var(--glow-green)}
.pk-window[data-color=amber]{--on:var(--lamp-amber-on);--off:var(--lamp-amber-off);--hot:var(--lamp-amber-hot);--fg-on:var(--ink-amber-on);--fg-off:var(--ink-amber-off);--glow:var(--glow-amber)}
.pk-window::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 110% at 24% 50%,var(--hot) 0,color-mix(in srgb,var(--hot) 60%,transparent) 45%,transparent 100%),radial-gradient(ellipse 34% 110% at 76% 50%,var(--hot) 0,color-mix(in srgb,var(--hot) 60%,transparent) 45%,transparent 100%),linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.10)),var(--on);box-shadow:var(--glow);opacity:0;transition:opacity .22s ease-out}
.pk-window>span{position:relative}
.pk-window .pk-des{font-size:10px;letter-spacing:.04em}
.pk-window[data-state=on],.pk-window[data-state=test]{color:var(--fg-on);transition:color .09s ease-in}
.pk-window[data-color=red][data-state=on],.pk-window[data-color=green][data-state=on],.pk-window[data-color=red][data-state=test],.pk-window[data-color=green][data-state=test]{text-shadow:0 0 5px rgba(255,255,255,.55)}
.pk-window[data-state=on]::before,.pk-window[data-state=test]::before{opacity:1;transition:opacity .09s ease-in}
.pk-window[data-state=flash]{animation:pk-flash-fg .5s steps(1) infinite}
.pk-window[data-state=flash]::before{animation:pk-flash .5s linear infinite}
@keyframes pk-flash{0%{opacity:0}16%{opacity:1}50%{opacity:1}90%{opacity:0}100%{opacity:0}}
@keyframes pk-flash-fg{0%{color:var(--fg-on)}60%{color:var(--fg-off)}}

/* guard + key */
.pk-guard{position:relative;padding:10px;border:4px solid var(--lamp-red-on);border-radius:6px;background:repeating-linear-gradient(45deg,var(--lamp-amber-on) 0 10px,var(--bakelite) 10px 20px);perspective:400px}
.pk-guard-well{display:flex;align-items:center;gap:10px;padding:8px;background:var(--enamel);border-radius:3px}
.pk-key{width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:3px solid var(--bezel);background:radial-gradient(circle,var(--aluminium) 0 12px,#8d8d86 13px 14px,var(--aluminium) 15px);cursor:pointer;padding:0;position:relative;transition:transform .14s cubic-bezier(.4,1.6,.6,1)}
.pk-key::after{content:"";position:absolute;left:24px;top:14px;width:4px;height:22px;background:#111}
.pk-key.is-armed{transform:rotate(90deg)}


/* nixie */
.pk-nixie{display:flex;gap:2px;padding:3px 8px;background:var(--nixie-glass);border:4px solid var(--bezel);border-radius:var(--radius-window);box-shadow:var(--glass-inset)}
.pk-digit{position:relative;width:var(--tube-w);height:var(--tube-h);font:400 34px/48px var(--font-nixie);color:var(--nixie-glow);text-shadow:var(--glow-nixie);text-align:center}
.pk-digit.is-sep{width:10px}
.pk-nixie.is-xl .pk-digit{width:54px;height:84px;font-size:60px;line-height:84px}
.pk-digit>span{position:absolute;inset:0;transition:opacity .06s linear}
.pk-digit>.pk-ghost{opacity:0}
.pk-digit.is-change>.pk-ghost{opacity:.35}
.pk-unit{font:600 13px/1 var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}

/* drum counter */
.pk-drum{display:flex;padding:6px 8px;background:#111;border:var(--bezel-w) solid var(--bezel);border-radius:var(--radius-window)}
.pk-wheel{width:var(--drum-cell-w);height:var(--drum-cell-h);overflow:hidden;background:var(--drum-wheel);border-left:1px solid #111;box-shadow:inset 0 7px 6px -4px rgba(0,0,0,.55),inset 0 -7px 6px -4px rgba(0,0,0,.55)}
.pk-strip{display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.45,0,.3,1.25)}
.pk-strip>span{height:var(--drum-cell-h);font:600 24px/32px var(--font-label);color:var(--drum-ink);text-align:center}

/* meters */
.pk-meter{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;background:var(--bakelite);border-radius:var(--radius-meter)}
.pk-meter svg text{font-family:var(--font-label);font-weight:600;font-size:15px;fill:var(--tag-ink)}
.pk-face{fill:var(--meter-face);stroke:var(--bezel);stroke-width:2}
.pk-tick{stroke:var(--tag-ink)}
.pk-redzone{stroke:var(--lamp-red-on);fill:var(--lamp-red-on)}
.pk-needle{transform-origin:110px 118px;transition:transform .7s cubic-bezier(.3,1.55,.45,1)}
.pk-pointer{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}

.pk-grille{width:96px;height:96px;border-radius:50%;border:4px solid var(--bezel);background:repeating-linear-gradient(0deg,var(--bakelite) 0 5px,var(--enamel-recess) 5px 10px)}
.pk-grille.is-sounding{animation:pk-buzz .04s linear infinite}
@keyframes pk-buzz{50%{transform:translateX(.6px)}}
@media (prefers-reduced-motion:reduce){.pk-needle,.pk-pointer,.pk-strip,.pk-knobturn,.pk-lever,.pk-key{transition-duration:.01s}.pk-flap{animation-duration:.01s!important}.pk-window[data-state=flash]::before,.pk-lens[data-state=flash]::before{animation-duration:1s}}

/* ---------- round lens: chrome collar, domed glass, fresnel rings ---------- */
.pk-lens{--on:var(--lamp-white-on);--off:var(--lamp-white-off);--glow:var(--glow-white);position:relative;width:44px;height:44px;flex:none;border-radius:50%;
 background:conic-gradient(from 215deg,#f6f7f2,#8e9189 16%,#ecede7 31%,#6c6f68 50%,#dcddd6 67%,#868981 83%,#f6f7f2);box-shadow:0 2px 3px rgba(0,0,0,.55),0 0 0 1.5px var(--bezel)}
.pk-lens[data-color=green]{--on:var(--lamp-green-on);--off:var(--lamp-green-off);--glow:var(--glow-green)}
.pk-lens[data-color=red]{--on:var(--lamp-red-on);--off:var(--lamp-red-off);--glow:var(--glow-red)}
.pk-lens[data-color=amber]{--on:var(--lamp-amber-on);--off:var(--lamp-amber-off);--glow:var(--glow-amber)}
.pk-lens>span{position:absolute;inset:6px;border-radius:50%;pointer-events:none}
.pk-lens-glass{background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.6) 100%),var(--off);box-shadow:0 0 0 1.5px #0d0d0c,inset 0 3px 5px rgba(0,0,0,.75)}
.pk-lens-lit{background:radial-gradient(circle at 50% 54%,#fff 0 9%,rgba(255,255,255,.6) 20%,transparent 52%),radial-gradient(circle,transparent 58%,rgba(0,0,0,.4) 100%),var(--on);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--on) 45%,transparent),var(--glow);opacity:0;transition:opacity .22s ease-out}
.pk-lens-dome{background:radial-gradient(ellipse 46% 30% at 36% 24%,rgba(255,255,255,.8),transparent 70%),radial-gradient(ellipse 30% 14% at 62% 82%,rgba(255,255,255,.18),transparent 70%),repeating-radial-gradient(circle,rgba(255,255,255,.13) 0 1px,transparent 1px 4px)}
.pk-lens[data-state=on]>.pk-lens-lit,.pk-lens[data-state=test]>.pk-lens-lit{opacity:1;transition:opacity .09s ease-in}
.pk-lens[data-state=flash]>.pk-lens-lit{animation:pk-flash .5s linear infinite}
.pk-lenscap{font:600 12px/1 var(--font-engraved);letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}

/* ---------- pushbutton: a cap that sinks into its hole ---------- */
.pk-btn,.pk-round{position:relative;flex:none;width:var(--button);height:var(--button);padding:0;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;font:700 15px/1 var(--font-label);letter-spacing:.06em;text-transform:uppercase}
.pk-btn{border-radius:10px;background:linear-gradient(145deg,#55554f,#121211);box-shadow:0 1px 0 rgba(255,255,255,.4),0 0 0 1px #000}
.pk-round{border-radius:50%;background:conic-gradient(from 215deg,#f6f7f2,#8e9189 16%,#ecede7 31%,#6c6f68 50%,#dcddd6 67%,#868981 83%,#f6f7f2);box-shadow:0 2px 3px rgba(0,0,0,.55),0 0 0 1.5px var(--bezel)}
.pk-hole{position:absolute;inset:6px;border-radius:6px;background:#050504;box-shadow:inset 0 0 0 1px #000}
.pk-round>.pk-hole{inset:8px;border-radius:50%}
.pk-cap{--cap:var(--lamp-white-off);--capfg:var(--ink-white-off);position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;color:var(--capfg);
 background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 38%,rgba(0,0,0,.2)),var(--cap);
 box-shadow:0 3px 4px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.28);transition:transform .045s linear,filter .045s linear,box-shadow .045s linear,background-color .22s ease-out,color .22s ease-out}
.pk-btn[data-tone=amber] .pk-cap{--cap:var(--lamp-amber-off);--capfg:var(--ink-amber-off)}
.pk-btn[data-tone=red] .pk-cap{--cap:var(--lamp-red-on);--capfg:var(--ink-red-off)}
.pk-round .pk-cap{color:var(--engraving);font-size:14px;background:radial-gradient(circle at 38% 28%,#66665f 0,#2a2a27 38%,#0c0c0b 100%);box-shadow:0 3px 4px rgba(0,0,0,.7),inset 0 1px 1px rgba(255,255,255,.35)}
.pk-shade{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .045s linear;box-shadow:inset 0 9px 8px -3px rgba(0,0,0,.85),inset 6px 0 7px -4px rgba(0,0,0,.6),inset -6px 0 7px -4px rgba(0,0,0,.6),inset 0 -3px 4px -2px rgba(0,0,0,.4)}

 font:600 12px/1 var(--font-engraved);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-red-on)}

.pk-tag{border:0;background:linear-gradient(180deg,#eceee8,var(--tag) 60%,#aeb1a8);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,255,255,.6)}

.r.center{justify-content:center}
.c{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lg{display:flex;flex-direction:column;gap:8px}

        s.sub = Math.random() < 0.2 ? !s.sub : s.sub; s.api = Math.min(0.95, Math.max(0.1, s.api + (Math.random() - 0.5) * 0.04)); s.tool = Math.min(0.9 - s.api * 0.5, Math.max(0.05, s.tool + (Math.random() - 0.5) * 0.04));
        if (s.ctx > s.win * 0.93 && !s.cmpct) { s.cmpct = true; setTimeout(function () { s.cmpct = false; s.ctx = Math.floor(s.win * 0.18); }, 4000); }
        if (Math.random() < 0.035) { s.busy = false; s.sub = false; if (s.bkgd && Math.random() < 0.5) s.block = true; else if (Math.random() < 0.5) s.wait = true; else { s.done = true; s.agent = Math.random() < 0.4; } if (s.queue > 0) s.queue--; }
      } else if (Math.random() < 0.04) { s.wait = s.done = s.agent = s.block = false; s.busy = true; s.turn = 0; s.msgs = 0; s.queue = Math.floor(Math.random() * 3); }   /* the operator answered */
    });
    if (onBattery) battery = Math.max(0, battery - 0.004); else battery = Math.min(1, battery + 0.002);
    render(false);
  }
  function render(force) {
    if (!power || testing) return;
    var run = 0, busy = 0;
    S.forEach(function (s, i) {
      var n = i + 1, p = s.present; if (p) run++; if (p && s.busy) busy++;
      ann.set('run', n, p); ann.set('busy', n, p && s.busy); ann.set('wait', n, p && s.wait); ann.set('done', n, p && s.done); ann.set('agent', n, p && s.agent); ann.set('bkgd', n, p && s.bkgd); ann.set('block', n, p && s.block); ann.set('cmpct', n, p && s.cmpct);
    });
    P.nixie(nRun, String(run)); P.nixie(nBusy, String(busy));
    P.nixie(nSel, String(selected)); P.nixie(tgtA, String(selected)); P.nixie(tgtC, String(selected));
    var s = S[selected - 1], p = s.present;
    P.meter(mCtx, p ? 1 - s.ctx / s.win : -0.03); P.meter(mApi, p ? s.api : -0.03); P.meter(mTool, p ? s.tool : -0.03);
    P.lamp(w200, p && s.win === 2e5 ? 'on' : 'off'); P.lamp(w1m, p && s.win === 1e6 ? 'on' : 'off');
    P.nixie(NX.ctx, pad(p ? s.ctx : 0, 8)); P.nixie(NX['in'], pad(p ? s.inp : 0, 8)); P.nixie(NX.out, pad(p ? s.out : 0, 8)); P.nixie(NX.think, pad(p ? s.think : 0, 8));
    P.nixie(NX.cr, pad(p ? s.cr / 1000 : 0, 8)); P.nixie(NX.cw, pad(p ? s.cw / 1000 : 0, 8)); P.nixie(NX.queue, pad(p ? s.queue : 0, 2)); P.nixie(NX.tools, pad(p ? s.tools : 0, 4));
    P.nixie(NX.turn, pad(p ? s.turn / 60 : 0, 2) + ':' + pad(p ? s.turn % 60 : 0, 2)); P.nixie(NX.msgs, pad(p ? s.msgs : 0, 3));
    var up = p ? (Date.now() - s.start) / 60000 : 0; P.nixie(NX.up, pad(up / 60, 2) + ':' + pad(up % 60, 2));
    P.nixie(NX.cost, pad(p ? s.cost : 0, 4) + '.' + pad(p ? (s.cost * 100) % 100 : 0, 2));
    setGroup(gPerm, p && s.perm); setGroup(gEff, p && s.effort); setGroup(gModel, p && s.model); setGroup(gMode, p && s.mode); setGroup(gKind, p && s.kind); setGroup(gTier, p && s.tier);
    P.lamp(gWarn.map.sub, p && s.sub ? 'on' : 'off'); P.lamp(gWarn.map.pre, p && s.cmpct ? 'on' : 'off'); P.lamp(gWarn.map.stale, 'off'); P.lamp(gWarn.map.price, 'off');
    if (Math.floor(totals.cost) !== dCost.value) P.drum(dCost, Math.floor(totals.cost));
    if (Math.floor(totals.out / 1000) !== dOut.value) P.drum(dOut, Math.floor(totals.out / 1000));
    if (totals.add !== dAdd.value) P.drum(dAdd, totals.add); if (totals.rem !== dRem.value) P.drum(dRem, totals.rem);
    P.edge(mBatt, battery); P.lamp(wMains, onBattery ? 'off' : 'on'); P.lamp(wBatt, onBattery ? 'on' : 'off'); P.lamp(wChg, !onBattery && battery < 0.999 ? 'on' : 'off');
    var low = battery < 0.2, st = wLow.getAttribute('data-state'); if (low && st === 'off') P.lamp(wLow, 'flash'); if (!low && st !== 'off') P.lamp(wLow, 'off');
    P.lamp(wPower, 'on');
  }

  /* lamp test: every window, lens and lit cap, while TEST is held */
  var saved = [];
  function lampTest(on) {
    if (!power) return;
    if (on) {
      saved = []; [].forEach.call(desk.querySelectorAll('.pk-window,.pk-lens'), function (e) { saved.push([e, e.getAttribute('data-state')]); });
      testing = true; ann.lampTest(true);
      saved.forEach(function (x) { P.lamp(x[0], x[0].classList.contains('pk-lens') ? 'on' : 'test'); }); [].forEach.call(desk.querySelectorAll('.pk-btn'), function (b) { b.classList.add('is-lit'); });
    } else {
      saved.forEach(function (x) { P.lamp(x[0], x[1]); }); [].forEach.call(desk.querySelectorAll('.pk-btn'), function (b) { b.classList.remove('is-lit'); });
      testing = false; ann.lampTest(false); render(true);
    }
  }
  bTest.button.addEventListener('pointerdown', function () { lampTest(true); });
  ['pointerup', 'pointerleave'].forEach(function (e) { bTest.button.addEventListener(e, function () { if (testing) lampTest(false); }); });

  /* mains */
  function setPower(on) {
    if (!on) {
      power = false; testing = false; P.sound.buzzer(false); desk.classList.add('is-off');
      [].forEach.call(desk.querySelectorAll('.pk-window,.pk-lens'), function (e) { P.lamp(e, 'off'); }); [].forEach.call(desk.querySelectorAll('.pk-btn'), function (b) { b.classList.remove('is-lit'); });
      [mCtx, mApi, mTool].forEach(function (m) { P.meter(m, -0.03); }); P.edge(mBatt, 0); return;
    }
    setTimeout(function () { P.lamp(wPower, 'on'); }, 250);
    setTimeout(function () { desk.classList.remove('is-off'); [].forEach.call(desk.querySelectorAll('.pk-nixie'), function (n) { var str = ''; [].forEach.call(n.children, function (c) { str += c.classList.contains('is-sep') ? c.firstChild.textContent : '8'; }); P.nixie(n, str); }); }, 400);
    setTimeout(function () { power = true; lampTest(true); }, 650);
    setTimeout(function () { lampTest(false); }, 1650);
  }

  /* ================= room controls (outside the console) ================= */
  var bar = document.getElementById('bar');
  function group(label, opts, current, fn) {
    var g = h('div', { 'class': 'grp' }, [h('span', { text: label })]);
    opts.forEach(function (o) { var b = h('button', { type: 'button', 'aria-pressed': String(o[0] === current), text: o[1] }); b.addEventListener('click', function () { [].forEach.call(g.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); fn(o[0]); }); g.appendChild(b); });
    bar.appendChild(g);
  }
  var fin = 'hammer'; try { fin = localStorage.getItem('pk4-finish') || 'hammer'; } catch (e) {}
  function setFinish(f) { desk.setAttribute('data-finish', f); try { localStorage.setItem('pk4-finish', f); } catch (e) {} }
  setFinish(fin);
  group('Panel finish', [['hammer', 'Grey-green'], ['ivory', 'Ivory'], ['graphite', 'Graphite']], fin, setFinish);
  group('Room lights', [['auto', 'Auto'], ['light', 'On'], ['dark', 'Dimmed']], 'auto', function (v) { if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); });
  group('Lamp codes', [['off', 'Hidden'], ['on', 'Shown']], 'off', function (v) { desk.classList.toggle('nocodes', v === 'off'); }); desk.classList.add('nocodes');
  group('Sound', [['on', 'On'], ['off', 'Off']], 'on', function (v) { P.sound.enabled = v === 'on'; if (v === 'off') P.sound.buzzer(false); });
  group('Demo', [['mains', 'On mains'], ['batt', 'Unplug']], 'mains', function (v) { onBattery = v === 'batt'; });
  bar.appendChild(h('span', { 'class': 'tip', id: 'log', text: 'Fake telemetry is running. Everything on the desk is live: turn the selector, press, hold TEST, lift a guard, flip MAINS.' }));

  /* fit the 2500-unit desk to the window width */
  var fit = document.getElementById('fit');
  function resize() { var k = fit.clientWidth / 2500; desk.style.transform = 'scale(' + k + ')'; fit.style.height = Math.ceil(desk.offsetHeight * k) + 'px'; }
  window.addEventListener('resize', resize); resize(); setTimeout(resize, 400); setTimeout(resize, 1500);

  ready = true; P.nixie(nSel, '1'); render(true); setInterval(step, 500);
})();

</script>
